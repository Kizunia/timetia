
# Local infrastructure (ADR 0040). The applications run on the host; the `apps` profile (added with the Dockerfiles)
# runs them in containers. LGTM sits in the `observability` profile, which .env switches on by default.

services:
  mysql:
    image: mysql:8.4
    container_name: kibootia-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: kibootia
      MYSQL_USER: kibootia_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    ports:
      - "3307:3306"
    volumes:
      - kibootia_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  adminer:
    image: adminer:6.3.0
    container_name: kibootia-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      mysql:
        condition: service_healthy

  # Keycloak's own database (ADR 0045). Not published on the host.
  keycloak-db:
    image: postgres:17.11
    container_name: kibootia-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
    volumes:
      - kibootia_keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Fixed public hostname with a dynamic back channel: browsers see http://localhost:8180, other containers reach
  # Keycloak as http://keycloak:8080, and the issuer in tokens stays the public one (ADR 0040, OQ-45).
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: kibootia-keycloak
    restart: unless-stopped
    command: ["start-dev"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      # The image has no curl; probe the management port (9000) with bash.
      test:
        - "CMD-SHELL"
        - "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # One-shot: applies the realm (shared base plus the local overlay) with OpenTofu, then exits.
  keycloak-config:
    image: ghcr.io/opentofu/opentofu:1.13.9
    container_name: kibootia-keycloak-config
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        tofu -chdir=/infra/overlays/local init -input=false &&
        tofu -chdir=/infra/overlays/local apply -auto-approve -input=false -state=/state/terraform.tfstate
    environment:
      TF_DATA_DIR: /state/.terraform
      TF_VAR_keycloak_url: http://keycloak:8080
      TF_VAR_keycloak_admin_password: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      TF_VAR_web_client_secret: ${KEYCLOAK_WEB_CLIENT_SECRET:?Set KEYCLOAK_WEB_CLIENT_SECRET in .env}
      TF_VAR_admin_client_secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?Set KEYCLOAK_ADMIN_CLIENT_SECRET in .env}
      TF_VAR_demo_user_password: ${DEMO_USER_PASSWORD:?Set DEMO_USER_PASSWORD in .env}
    volumes:
      - ./infra/keycloak:/infra:ro
      - kibootia_tofu_state:/state
    depends_on:
      keycloak:
        condition: service_healthy

  # Catches the mail Keycloak sends locally. UI on http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.33.1
    container_name: kibootia-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"

  # Grafana, Tempo, Loki and an OTLP receiver in one container, for development only (ADR 0030).
  lgtm:
    image: grafana/otel-lgtm:0.40.0
    container_name: kibootia-lgtm
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "3001:3000"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - kibootia_lgtm_data:/data

volumes:
  kibootia_mysql_data:
  kibootia_keycloak_db_data:
  kibootia_tofu_state:
  kibootia_lgtm_data:
