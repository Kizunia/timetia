spring.application.name=kibootia

# Local values come from the root .env (created by 'pnpm bootstrap'); real environment variables take precedence.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3307/kibootia
spring.datasource.username=kibootia_app
# Required, no default. Startup fails with a message naming the setting when it is missing.
spring.datasource.password=${MYSQL_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Instants are stored as UTC in DATETIME(6) columns, without session time zone conversion.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Each module keeps its migrations in its own folder; add a module's folder here when it gets its first migration.
spring.flyway.locations=classpath:db/migration/platform,classpath:db/migration/audit,classpath:db/migration/access,classpath:db/migration/identity,classpath:db/migration/notes

# Token validation (ADR 0008, ADR 0040). The issuer is the public Keycloak URL that tokens carry; keys are fetched from
# jwk-set-uri, which can be an internal address. Override with KIBOOTIA_SECURITY_ISSUER, KIBOOTIA_SECURITY_JWK_SET_URI
# and KIBOOTIA_SECURITY_AUDIENCE. These are addresses, not secrets.
kibootia.security.issuer=http://localhost:8180/realms/kibootia
kibootia.security.jwk-set-uri=http://localhost:8180/realms/kibootia/protocol/openid-connect/certs
kibootia.security.audience=kibootia-api

# Identity (ADR 0025, ADR 0041). The backend calls the Keycloak Admin API with the kibootia-admin service-account client,
# whose secret is required and comes from the environment or the local .env, never from this file. base-url is
# Keycloak as the backend reaches it (inside Compose, the internal address); public-base-url is where users reach the
# web application, which the links in Keycloak's emails return to. The bootstrap address is made the first
# administrator when it signs in with a verified email address while no administrator exists; leave it empty otherwise.
kibootia.identity.public-base-url=http://localhost:3470
kibootia.identity.keycloak.base-url=http://localhost:8180
kibootia.identity.keycloak.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:}
kibootia.identity.bootstrap-admin-email=${KIBOOTIA_BOOTSTRAP_ADMIN_EMAIL:}

# Health runs on an internal management port that is not the API port (ADR 0047). Only health is exposed, with
# liveness and readiness groups; readiness checks MySQL only. Bound to loopback so it is never published by accident.
management.server.port=8090
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=db

# Observability (ADR 0030): traces and metrics go over OTLP to the local Grafana LGTM container, and the console prints
# structured JSON with the trace and span ID. One switch turns the OTLP export off:
# KIBOOTIA_OBSERVABILITY_ENABLED=false (the trace ID is still created and logged).
# OTLP log export is NOT wired (OQ-42): Boot's log exporter needs OpenTelemetry's Logback appender, which the starter
# does not include. Until then logs reach Grafana only through the console JSON.
kibootia.observability.enabled=true
management.tracing.export.otlp.enabled=${kibootia.observability.enabled}
management.otlp.metrics.export.enabled=${kibootia.observability.enabled}
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.opentelemetry.resource-attributes.service.name=kibootia-backend
# Local development traces everything; production lowers this.
management.tracing.sampling.probability=1.0
logging.structured.format.console=ecs

# OpenAPI (ADR 0043). The committed openapi.json is written by OpenApiContractIT. The description and Swagger UI are
# served as management endpoints, which are exposed only when asked for (`pnpm dev` does; production does not).
springdoc.use-management-port=true
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/v3/api-docs
springdoc.writer-with-order-by-keys=true
