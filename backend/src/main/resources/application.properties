spring.application.name=kibootia

# Local values come from the root .env (created by 'pnpm setup'); real environment variables take precedence.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3307/kibootia
spring.datasource.username=kibootia_app
# Required, no default. Startup fails with a message naming the setting when it is missing.
spring.datasource.password=${MYSQL_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Each module keeps its migrations in its own folder; add a module's folder here when it gets its first migration.
spring.flyway.locations=classpath:db/migration/platform
