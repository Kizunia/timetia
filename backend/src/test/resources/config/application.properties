# Tests get their database from Testcontainers (ServiceConnection); this placeholder only satisfies the required-settings check.
spring.datasource.password=replaced-by-testcontainers

# Test-only tables (src/test/resources/db/migration/test-fixtures) are migrated beside the application's own.
spring.flyway.locations=classpath:db/migration/platform,classpath:db/migration/audit,classpath:db/migration/access,classpath:db/migration/identity,classpath:db/migration/files,classpath:db/migration/notes,classpath:db/migration/test-fixtures

# Tests never reach a real object store: the storage port is replaced by an in-memory fake (TestcontainersConfiguration).
kibootia.files.access-key=replaced-by-the-fake-object-storage
kibootia.files.secret-key=replaced-by-the-fake-object-storage

# Tests never reach a real Keycloak: the identity port is replaced by a fake (TestcontainersConfiguration).
kibootia.identity.keycloak.client-secret=replaced-by-the-fake-identity-provider

# Scheduled jobs do not fire on their own in tests; a test that needs one calls it directly or turns this on.
kibootia.jobs.enabled=false

# Tests do not export telemetry; the trace ID is still created.
kibootia.observability.enabled=false

# The root .env a developer gets from pnpm bootstrap sets a bootstrap address. Without these, every test context would send
# a startup invitation to it, and a test that counts events fails. A test that needs the bootstrap sets both itself.
kibootia.identity.bootstrap-admin-email=
kibootia.identity.bootstrap-invite.enabled=false
